<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://*.gstatic.com https://apis.google.com https://cdnjs.cloudflare.com; connect-src 'self' https://*.googleapis.com https://*.gstatic.com https://www.gstatic.com https://*.firebaseio.com https://*.cloudfunctions.net https://*.firebaseapp.com wss://*.firebaseio.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com data:; img-src 'self' https: data: blob:;">
    <title>Committee - SEAMUNs</title>
    <link rel="icon" type="image/png" href="../assets/logo.png">
    <link rel="apple-touch-icon" href="../assets/logo.png">
    <link rel="stylesheet" href="../css/styles.css?v=14">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="theme-controls">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode" type="button">
            <i class="fas fa-moon" id="themeIcon"></i>
        </button>
        <div class="theme-selector" id="themeSelector">
            <span class="theme-selector-label">Theme</span>
            <div class="color-swatch" data-color="red" title="Red Theme"></div>
            <div class="color-swatch" data-color="orange" title="Orange Theme"></div>
            <div class="color-swatch" data-color="yellow" title="Yellow Theme"></div>
            <div class="color-swatch" data-color="green" title="Green Theme"></div>
            <div class="color-swatch active" data-color="blue" title="Blue Theme"></div>
            <div class="color-swatch" data-color="purple" title="Purple Theme"></div>
            <div class="color-swatch" data-color="pink" title="Pink Theme"></div>
            <div class="color-swatch" data-color="grey" title="Grey Theme"></div>
            <div class="color-swatch" data-color="mono" title="Monochrome Theme"></div>
        </div>
    </div>

    <header class="header">
        <div class="container">
            <h1 style="display: flex; align-items: center; justify-content: center; gap: 12px;"><a href="../index.html" style="display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none;"><img src="../assets/logo.png" alt="SEAMUNs Logo" style="height: 60px; width: auto;"><span>SEAMUNs</span></a></h1>
            <p>Track upcoming and previous Model United Nations conferences across South East Asia 🌏</p>
        </div>
    </header>

    <main class="conference-detail-main committee-page-main">
        <div class="container">
            <a href="#" id="backToConference" class="conference-detail-back"><i class="fas fa-arrow-left"></i> Back to conference</a>
            <header class="conference-detail-hero committee-page-hero">
                <p class="committee-page-conference-name" id="conferenceName" style="font-size: 1rem; color: var(--text-secondary); margin-bottom: 4px;"></p>
                <h1 class="committee-page-title" id="committeeName" style="font-family: var(--font-display); font-size: 1.75rem; margin: 0;"></h1>
            </header>
            <section class="detail-section">
                <div class="detail-section-content" id="committeeDetail">
                    <p style="color: var(--text-secondary);">Loading committee…</p>
                </div>
            </section>
        </div>
    </main>

    <script src="../js/env-loader.js" data-env-path="../env.js"></script>
    <script src="../js/conferences-data.js"></script>
    <script src="../firebase-config.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/conference-detail.js"></script>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var conferenceId = params.get('id');
            var committeeIndex = parseInt(params.get('committee'), 10);
            var container = document.getElementById('committeeDetail');
            var backLink = document.getElementById('backToConference');
            var conferenceNameEl = document.getElementById('conferenceName');
            var committeeNameEl = document.getElementById('committeeName');

            if (!conferenceId || isNaN(committeeIndex) || committeeIndex < 0) {
                if (container) container.innerHTML = '<p style="color: var(--text-secondary);">Missing conference or committee. <a href="../index.html">Back to conferences</a>.</p>';
                if (backLink) backLink.href = '../index.html';
                document.title = 'Committee not found - SEAMUNs';
                return;
            }

            var conf = typeof getConferenceForDetailPage !== 'undefined' ? getConferenceForDetailPage(conferenceId) : null;
            if (!conf) {
                if (container) container.innerHTML = '<p style="color: var(--text-secondary);">Conference not found. <a href="../index.html">Back to conferences</a>.</p>';
                if (backLink) backLink.href = '../index.html';
                document.title = 'Conference not found - SEAMUNs';
                return;
            }

            if (!conf.committees || !Array.isArray(conf.committees) || committeeIndex >= conf.committees.length) {
                if (container) container.innerHTML = '<p style="color: var(--text-secondary);">Committee not found. <a href="conference-template.html?id=' + encodeURIComponent(conferenceId) + '">Back to conference</a>.</p>';
                if (backLink) backLink.href = 'conference-template.html?id=' + encodeURIComponent(conferenceId);
                document.title = (conf.name || 'Conference') + ' - SEAMUNs';
                return;
            }

            var committee = conf.committees[committeeIndex];
            if (backLink) backLink.href = 'conference-template.html?id=' + encodeURIComponent(conferenceId);
            if (conferenceNameEl) conferenceNameEl.textContent = conf.name || 'Conference';
            var displayName = typeof getCommitteeDisplayName !== 'undefined' ? getCommitteeDisplayName(committee) : (typeof committee === 'string' ? committee.split(' - ')[0].trim() : (committee.committee_name || committee.name || 'Committee'));
            if (committeeNameEl) committeeNameEl.textContent = displayName;
            document.title = displayName + ' — ' + (conf.name || 'Conference') + ' - SEAMUNs';

            if (typeof buildCommitteeItemHTML !== 'undefined' && container) {
                container.innerHTML = buildCommitteeItemHTML(conf, committee, committeeIndex, { view: 'full' });
                if (typeof window.dispatchEvent === 'function') {
                    window.dispatchEvent(new CustomEvent('mun-dynamic-content-ready'));
                }
            } else if (container) {
                container.innerHTML = '<p style="color: var(--text-secondary);">Unable to load committee details.</p>';
            }
        })();
    </script>
</body>
</html>
