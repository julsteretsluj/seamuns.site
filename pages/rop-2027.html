        const t1 = "Preface\n\nPreface\n\nDear Delegates, Chairs, Advisors, and Guests of SEAMUN I 2027\n\n(South East Asian Model United Nations Conference Thailand 2027),\n\nWe are thrilled to welcome you to SEAMUN's first-ever conference! With that being said, expectations must be clear in order to maintain the integrity of debate without pushing for excessive competition.\n\nThe following document aims to guide you all on the procedures and expectations of the SEAMUN I Conference. The sections will be as follows:\n\nIntroduction \u2192 A message from the Secretariat\n\nConference Rules \u2192 Rules of conduct and authority\n\nShort Form & Long Form \u2192 Brief statements (short form) regarding each rule, in-depth statements (long form) regarding each rule\n\nExamples \u2192 Examples of procedures\n\nAnnex \u2192 Resources\n\nPlease familiarise yourself with this document as a delegate or chair to ensure you are well prepared for the specific context of SEAMUN I.\n\nBest Regards,\n\nJules Kitto-Astrop\n\n(The Secretary General)\n\nIntroduction\n\nIntroduction\n\nSEAMUN I 2027 is the first-ever multinational independent MUN conference completely led by students. The conference spans across 2 whole days, featuring frequent and optional breaks, icebreakers, as well as the highly anticipated debate and committee sessions. The SEAMUN I 2027 conference is open to ages 12-18 (Grade 7-12/Year 8-13) with possible exceptions made on a case-by-case basis. SEAMUN invites both individuals and school delegations to participate in the inaugural conference held at the KX (Knowledge Exchange) on January 23rd and 24th. SEAMUN I 2027 will be made up of 250 passionate attendees \u2013 200 delegates, 23 chairs, 7 SMT, and 20 advisors.\n\nThe benefits of participating in an MUN conference go far beyond a logo or sentence on a college application; the positive impacts of MUN on individuals, schools, nations, and international sectors are ones that I fully encourage. Model United Nations may have started as an academic competition for many, but I hope that by the end of SEAMUN I 2027, every delegate and chair walks away knowing they have a new world of experience and knowledge from the commitment they made. As a new member in the MUN circuit, having only joined in 2025, I aspire to push this conference beyond what others believed to be possible. I aim to build this conference on 3 pillars: purpose, collaboration, and diplomacy.\n\nPURPOSE \t\t\t\tCOLLABORATION \t\t\t   DIPLOMACY\n\nDeveloping solutions that\t\t           Listening and facilitating\t\t                Aligning with your\n\nhave actionable value, and are\t             communication amongst\t\t                  country stance\n\nviable for real-world \t\t          delegates is far more valuable                                  and maintaining\n\nimplementation. \t\t\t                and impactful than \t\t                   professionalism.\n\ndominating the floor.\n\nSEAMUN I 2027 will feature 2 crisis committees for which unique RoPs will be provided :\n\nSEAMUN I 2027: FWC RoP\n\nSEAMUN I 2027: UNSC RoP\n\nTo ensure everyone\u2019s preparedness, the Secretariat of SEAMUN I 2027 strongly encourages all Chairs and Delegates to read at least the first sections of this RoP, which describe the specific flow of committees and the requirements for debate.\n\nFurthermore, please do not hesitate to contact any SMT member or the official communication channels with any inquiries regarding the RoP or your specific committee adaptations. Newer members of MUN are encouraged to thoroughly read through this RoP and resort to several helpful resources provided at the end of this document.\n\nThe following page details the committees and topics on offer.\n\nCommittees & Topics\n\nThe SEAMUN I 2027 conference will include the following committees and topics:\n\nConference Rules\n\nSEAMUN I: Code of Conduct & Committee Rules\n\nI. Delegate Conduct & Language\n\nProfessional Respect: Absolute respect must be shown to all attendees, including fellow delegates, advisors, Chairs, Secretariat staff, and external providers.\n\nPolitical Neutrality: To maintain a safe and inclusive environment, personal political activism must be kept outside the conference. Debates should remain focused on the positions represented rather than personal beliefs.\n\nHate Speech & Harassment: Hate speech of any kind is strictly prohibited. This includes \"ironic\" use or jokes. Any language that targets identity or background will result in immediate disciplinary action.\n\nFormal Vocabulary: Slang, \"brain rot\" terminology, and meme references are strictly prohibited during formal sessions. While informal language is permitted during breaks and unmoderated caucuses, excessive use may negatively impact award eligibility.\n\nLanguage Policy:\n\nEnglish is the primary language of the conference. All formal proceedings and caucusing must be conducted in English.\n\nInappropriate language, including profanity, innuendo, and intentional use of derogatory slurs, is prohibited.\n\nII. Disciplinary System: Warnings and Strikes\n\nTo support the learning process while maintaining order, SEAMUN I utilises a tiered disciplinary system:\n\nWarnings: Delegates receive up to three warnings for minor infractions or breaches of decorum.\n\nStrike 1: Following three warnings, a delegate receives their first strike and loses all voting rights for the remainder of the session.\n\nStrike 2: A second strike results in a suspension of speaking rights in formal sessions.\n\nStrike 3: A third strike results in the immediate removal of the delegate from the committee and, potentially, from the conference premises.\n\nIII. Committee Regulations\n\nCommunication: Cross-talk is prohibited during formal debate. Communication must be conducted through the Chair, during unmoderated caucuses, or via Note Passing.\n\nNote Passing: Notes are for professional coordination. Inappropriate or harassing notes will be flagged, reported to the Secretariat, and will result in an immediate warning or strike.\n\nParliamentary Points: Points of Parliamentary Inquiry or Personal Privilege may be raised at any time and must be recognised by the Chair at the earliest opportunity.\n\nPosition Papers: Submission is required to be eligible for awards. While AI may be used for pre-conference research, generating the paper's text using AI is strictly prohibited.\n\nDiplomatic Consistency: Delegates must maintain their assigned country/character stance at all times. Deviating from an assigned stance due to personal bias will result in disqualification from all awards.\n\nIV. Technology & Tools\n\nArtificial Intelligence (AI) Policy:\n\nDelegates: Strictly prohibited from using AI to generate speeches or content during the conference (including breaks). Break-time research may use AI briefs or AI summaries but may not conduct back-and-forth responses.\n\nReports of AI use may be submitted privately to the Chair via note. Use of AI may result in automatic disqualification from all awards.\n\nChairs: Permitted to use AI tools for administrative and organisational purposes.\n\nProps: Permitted only if they are inanimate, non-disruptive, and relevant to the committee theme. Objects that can be interpreted as weapons (including toys) are strictly banned. The chairs must approve all objects in advance.\n\nV. Food & External Services\n\nFood delivery services are a privilege, not a right, and are subject to the following:\n\nGroup Orders: Must include at least 4 individuals and be organised by Committee Chairs.\n\nLogistics: Payments must be made online. Secretariat staff must be notified via a tracking link immediately upon ordering, and the order will be collected at the entrance.\n\nLimitations: Committees are limited to two group orders per day. The Secretariat reserves the right to confiscate or cancel orders that disrupt the schedule.\n\nShort Form\n\nRules of Procedure: Short Form\n\nChapter 1 - General Rules\n\nValidity of the Rules of Procedure (RoP)\n\nThese Rules of Procedure (RoP) are the governing authority for the Southeast Asian Medical Universities Model United Nations (SEAMUN I 2027). They apply to all simulated non-crisis committees. In specialised bodies like the UNSC, these rules apply unless superseded by the Crisis Team\u2019s specific mandates.\n\nAdditional Rules\n\nThe Secretariat and Committee Chairs may issue additional resources or \"Chair Reports.\" These are to be treated as valid extensions of the RoP. In the event of a procedural dispute or ambiguity, the Parliamentarian and Head of Academics have final authority over interpretation.\n\nDresscode\n\nDelegates are expected to maintain the highest standards of diplomatic decorum. Business Attire or culturally appropriate formal wear is mandatory.\n\nFor SEAMUN I, this includes suits, blazers, dress shirts, and formal footwear.\n\nCasual wear (denim, sneakers, t-shirts) is prohibited during sessions.\n\nThe dress code will be further explained in this document.\n\nThe Secretary & Deputy Secretary General\n\nThe Secretary-General and the Deputy Secretary-General oversee the conference's overarching vision. They reserve the right to intervene in any committee to ensure the mission\u2014bridging global health policy and diplomacy\u2014is upheld.\n\nAll final administrative decisions rest with the Secretary-General.\n\nThe Crisis Team\n\nThe Crisis Team manages the flow of external events. They have the sole authority to approve or deny crises.\n\nInformation used in debate must be historically accurate up to January 23, 2027. Any \"future\" information or updates will be provided exclusively by the Crisis Team.\n\nThe Dais\n\nEach room is led by a Head Chair and one or two Deputy Chairs.\n\nAuthority: The Head Chair directs the flow of debate. Deputy Chairs support research and procedural tracking but should actively participate in recognition and feedback without undermining the Head Chair.\n\nThe Floor: Only the recognised Delegate with the floor or the Chairs may speak. Exceptions are made only for urgent Points of Order or Personal Privilege.\n\nDigital Note System\n\nSEAMUN I utilises a digital system: seamunnotes.com.\n\nCredentials: Provided upon registration via a physical slip.\n\nMonitoring: The Secretariat monitors all digital communications.\n\nAny undiplomatic, harassing, or inappropriate content will be flagged and may result in disqualification.\n\nPre-Lobbying: Formal lobbying and the drafting of clauses before the conference are strictly prohibited to ensure a fair and collaborative environment.\n\nChapter 2 - General Sessions\n\nRoll Call\n\nAt the start of every session, the chairs will conduct a roll call.\n\nDelegates must respond with:\n\nPresent: The delegate is in the room and may choose to \"Abstain\" during substantive voting.\n\nPresent and Voting: The delegate waives the right to abstain and must vote \"Yes\" or \"No\" on all substantive matters.\n\nAbsent: Logged if a delegate is not present. Late arrivals must send a note to the Dais to be marked \"Present.\"\n\nMajorities and Voting\n\nSimple Majority: 50% of the present delegates plus one (1) vote.\n\nTwo-Thirds Majority: 66% of the present delegates plus one (1) vote. Used for high-impact procedural changes.\n\nFlow of Debate\n\nIf a committee has multiple topics, the floor is opened for a Motion to Set the Agenda to Question [A/B].\n\nThis requires a simple majority.\n\nIf no motion is made or passes, the committee follows the order established in the Background Guide.\n\nGeneral Speakers List (GSL)\n\nThe GSL is the committee's default state.\n\nStandard Time: 60 seconds (subject to change via motion).\n\nContent: Delegates speak on their country's general stance on the topic.\n\nYields: At the end of a GSL speech, if time remains, a delegate must yield:\n\nTo the Chair: Ends the speech. The Chair may ask if the delegate is open to questions (POIs &POCs).\n\nTo Points of Information (POIs): The speaker accepts questions from the floor.\n\nTo another Delegate: Passes the remaining time to a specific ally (cannot be yielded again).\n\nSpeeches\n\nAll delegates must begin their speeches with an address to the room (e.g., Honourable Chairs, Esteemed Delegates)\n\nSpeeches generally follow a simple formula\n\nA";
        const t2 = "ddress, Hook, Stance, Call to Action, Thank you, and Yield.\n\nDelegates may yield to the following:\n\nBack to the chair \u2013 chairs will then ask if the speaker is open to any POIs or POCs\n\nDelegates may respond with: A number, \u201cAny and All\u201d, or \u201cNone\u201d.\n\nTo (optional \u2013 number) questions \u2013 immediately opens the speaker up to POIs and POCs\n\nTo another delegate \u2013 Passes the remaining time to a specific ally (cannot be yielded again).\n\nInterruptions are only permitted for the following points and are highly discouraged during speeches:\n\nPoint of Order\n\nPoint of Personal Privilege (if it concerns the entire committee)\n\nChapter 3 - Points & Motions\n\nMotions\n\nModerated Caucus: A focused debate on a specific sub-topic.\n\nThe motion must include: Total time, Individual speaker time, and Purpose. (e.g., \"Motion for a 10-minute moderated caucus with a 30-second speaking time for the purpose of discussing vaccine equity.\")\n\nUnmoderated Caucus: Informal lobbying where delegates leave their seats to merge papers.\n\nMust specify a total time.\n\nConsultation: A formal-informal hybrid where the committee sits in a circle or informal setup to discuss without a speaker's list, facilitated by the Chair.\n\nMotion Hierarchy\n\nIf multiple motions are on the floor, the Chair will vote on them in order of \"disruptiveness\":\n\nSuspension/Adjournment (Ends the session)\n\nClosure of Debate (Moves to voting)\n\nCaucuses (Unmoderated, then Moderated)\n\nAdministrative (Agenda setting, speaker time)\n\nPoints\n\nPoints are used to address personal or procedural concerns and do not require a vote:\n\nPoint of Personal Privilege: Used for physical discomfort (e.g., \"Cannot hear the speaker,\" \"Room is too cold\"). Can interrupt a speaker only if it concerns audibility.\n\nPoint of Order: Used when a delegate believes the Chair has made a procedural error.\n\nPoint of Parliamentary Inquiry: A question to the Chair regarding the RoP.\n\nPoint of Information (PoI): A question directed to a delegate who has yielded their time.\n\nPoint of Clarification (PoC): A question regarding non-substantive or technical terms in a speech or document.\n\nRight of Reply: Requested via note if a delegate\u2019s national integrity has been directly insulted. Granted at Chair\u2019s discretion.\n\nChapter 4 - Resolutions\n\nResolutions\n\nWorking Paper: An informal draft. Not yet vetted by the Dais.\n\nDraft Resolution: A paper that has met the 15% Signatory requirement and been approved by the Secretariat for formatting and substance.\n\nIntroduction: Once approved, the main submitters will be recognised to read the operative clauses and answer POIs raised upon the acceptance of any or a number of POIs and POCs.\n\nAmendments\n\nAmendments are used to \"fix\" or \"improve\" a Draft Resolution.\n\nFriendly: Supported by all Main Submitters. Incorporated automatically upon Chair approval.\n\nUnfriendly: Not supported by all Main Submitters. Requires a specific debate (one speaker for, one against) and a simple majority vote by the committee to be included.\n\nUnfriendly amendments are voted upon and then implemented by the Chairs or Main Submitters (and ticked off on the amendment document)\n\nThe following amendments are not permitted to maintain diplomacy and collaboration principles:\n\nDeleting an entire resolution.\n\nReplacing an entire resolution.\n\nAdding an entire resolution.\n\nChapter 5 - Voting Procedures\n\nStructure of Voting\n\nOnce a Motion to Close Debate passes, the room enters \"Voting Procedure.\"\n\nLockout: No one may enter or leave the room.\n\nSilence: Note-passing and talking are suspended.\n\nAdministrative Actions: The Chair will first clear the floor of any outstanding amendments and \"Motions to Divide the Question\" (voting on specific clauses separately).\n\nMethods of Voting:\n\nBy Show of Placards: The standard method.\n\nBy Roll Call Vote: A delegate may motion for this. The Chair calls each country in turn. Delegates may vote: Yes, No, Yes with Rights, No with Rights, or Abstain. (Rights allow a delegate to explain a vote that contradicts their previous stance.)\n\nA Resolution passes if it receives a Simple Majority.\n\nIf it passes, it becomes (one of) the official \"Resolution of SEAMUN I 2027\" for that committee. If multiple resolutions are on the floor, they are voted on in the order they were introduced.\n\nLong Form\n\nRules of Procedure: Long Form\n\nChapter 1 - General Rules\n\nValidity of the Rules of Procedure (RoP)\n\nThese Rules of Procedure (RoP) govern the Southeast Asian Medical Universities Model United Nations (SEAMUN I 2027). They apply to all simulated non-crisis committees. In specialised bodies like the UNSC, these rules apply unless superseded by the Crisis Team\u2019s specific mandates.\n\nAdditional Rules\n\nThe Secretariat and Committee Chairs may issue additional resources or \"Chair Reports.\" These are to be treated as valid extensions of the RoP. In the event of a procedural dispute or ambiguity, the Parliamentarian and Head of Academics have final authority over interpretation.\n\nDresscode\n\nDelegates are expected to maintain the highest standards of diplomatic decorum. Business Attire or culturally appropriate formal wear is mandatory.\n\nFor SEAMUN I, this includes suits, blazers, dress shirts, and formal footwear.\n\nCasual wear (denim, sneakers, t-shirts) is prohibited during sessions.\n\nThe dress code will be further explained in this document.\n\nThe Secretary & Deputy Secretary General\n\nThe Secretary-General and the Deputy Secretary-General oversee the conference's overarching vision. They reserve the right to intervene in any committee to ensure the mission\u2014bridging global health policy and diplomacy\u2014is upheld.\n\nAll final administrative decisions rest with the Secretary-General.\n\nThe Crisis Team\n\nThe Crisis Team manages the flow of external events. They have the sole authority to approve or deny crises.\n\nInformation used in debate must be historically accurate up to January 23, 2027. Any \"future\" information or updates will be provided exclusively by the Crisis Team.\n\nThe Dais\n\nEach committee will be handled by two (or three) chairs. For crisis committees, a third chair will be present for the purpose of directive handling. Generally, the flow will follow the Head Chairs\u2019 discretion with Deputy Chair consultation. However, Deputy Chairs should be as active as the Head Chairs without undermining authority and experience.\n\nThe Chairs will handle the moderated debates by recognising a delegate\u2019s motion, point, or speech. Only the following people should speak at any given time (excluding unmoderated caucus):\n\nThe Chairs\n\nThe Delegate with the Floor\n\nDelegates wishing to raise a Point of Parliamentary Inquiry,  Order, or Personal Privilege\n\nOther\n\nThe Secretariat has selected excellent debate topics and is responsible for approving background guides/chair reports for each committee, as well as facilitating committee Instagram group chats for pre-conference questions, announcements, and informal but relevant topic discussions.\n\nPre-lobbying is not permitted.\n\nDuring registration, delegates will receive a slip with their note-passing credentials, which must be entered into seamunnotes.com to participate in the digital note-passing system.\n\nThe platform enables informal communication but also reminds all conference members that all notes are available to the Secretariat and that reporting options will be implemented to prevent inappropriate or undiplomatic contact.\n\nThe Secretariat will hold pre-conference meetings to review MUN procedures interactively. These sessions will be titled \u201cIntro to MUN\u201d and will last approximately 30 minutes.\n\nCommittee meetings are mandatory and are to be facilitated by a Secretariat member.\n\nIndividual delegate meetings are available upon request and at the chair\u2019s discretion.\n\nIndividual sessions with the Secretariat will also be available to prepare delegates as best we can before the conference and to provide knowledge that delegates will carry throughout their MUN careers.\n\nChapter 2 - General Sessions\n\nRoll Call\n\nBefore the beginning of any committee session, the Chairs will take \u201croll call\u201d, they will state each member's country name and wait for a response of one of the following :\n\nPresent \u2013 allows delegates to abstain from voting/not vote\n\nPresent and Voting \u2013 delegates must vote\n\nAbsent - determined by the chairs when a delegate is not in the room\n\nDelegates may change their stance at any point via a note to the chairs\n\nMajorities and Voting\n\nEvery member has one equal vote and cannot vote on behalf of another nation\n\nSimple majority: Lies at 50% of all delegates present +1 vote\n\nTwo-Thirds majority: Lies at two-thirds of all delegates present + 1 vote\n\nFlow of Debate\n\nThe debate begins with agenda setting, provided there is more than one topic. Delegates will motion to set the agenda to the question of ____.\n\nMotions are voted upon and require a simple majority to pass\n\nIf no motion to set the agenda is made, the agenda will be set in the order of the topics listed in the background guide/chair's report.\n\nGeneral Speakers List (GSL)\n\nAfter the agenda is set, delegates may request to be added to the general speakers list (GSL) to deliver a speech on a topic of their choice. The delegates will be added to the list and will be allotted 60 seconds for their speech unless otherwise moved for.\n\nMotions for extensions of speaker time may be permitted, depending on time constraints.\n\nDelegates may request to be added to the GSL at any time via a note to the chairs.\n\nGSL speeches will take place after all opening statements are complete.\n\nSpeeches\n\nAll delegates must begin their speeches with an address to the room (e.g., Honourable Chairs, Esteemed Delegates)\n\nSpeeches generally follow a simple formula\n\nAddress, Hook, Stance, Call to Action, Thank you, and Yield.\n\nDelegates may yield to the following:\n\nBack to the chair \u2013 chairs will then ask if the speaker is open to any POIs or POCs\n\nDelegates may respond with;\n\nA number\n\nAny and All\n\nNone\n\nTo (optional \u2013 number) questions \u2013 immediately opens the speaker up to POIs and POCs\n\nInterruptions are only permitted for the following points and are highly discouraged during speeches:\n\nPoint of Order\n\nPoint of Personal Privilege\n\nChapter 3 - Points & Motions\n\nMotions\n\nOne motion per round is permitted per delegate.\n\nMotions allowed at SEAMUN I 2027 are as follows:\n\nMotion to Set Agenda\n\nMotion to Extend Opening Speech Time\n\nMotion to Open Debate\n\nMotion to Divide the Question\n\nMotion to Exclude the Public\n\nMotion for a Minute of Silent Prayer or Meditation\n\nMotion for a Roll Call Vote\n\nMotion to Open Debate\n\nMotion to Adjourn Session\n\nMotion to Suspend Session\n\nMotion to Close Debate\n\nMotion for an Unmoderated Caucus\n\nMotion for a Moderated Caucus\n\nMotion for a Consultation\n\nMotion to Vote Clause by Clause\n\nAll motions are further explained in the long-form version of this RoP\n\nMotions may be raised at any time the floor is open to motions, as called by the chairs.\n\nMotions used only during voting \u2013 iv, v, vii, xv\n\nMotions used only during debate \u2013 i, ii, iii, iv, v, vi, viii, ix, x, xi, xii, xiii, xiv\n\nMotions must be voted on; no member may abstain\n\nDelegates may second a motion (without needing to obtain the floor)\n\nIf 2 or more delegates second a motion and there are no objections \u2192 motion automatically passes\n\nMotion Hierarchy\n\nAfter the chairs have collected motions, they will be dealt with in order from most to least disruptive. The hierarchy is as follows:\n\nSuspension of Session\n\nAdjournment of Session\n\nClose Debate, Open Debate\n\nModerated Caucus, Unmoderated Caucus\n\nSet Agenda, Set Speaker Time, Exclude Public, Open Speakers List\n\nEqually disruptive motions will be addressed in the order in which they were raised.\n\nPoints\n\nPoints must be directed to the chairs/through the chairs.\n\nPoints allowed at SEAMUN I 2027 are :\n\nPoint of Information (PoI)\n\nPoint of Clarification (PoC)\n\nPoint of Parliamentary Inquiry\n\nPoint of Order\n\nPoint of Personal Privilege\n\nRight of Reply\n\nAll points are further explained in t";
        const t3 = "he long-form version of this RoP\n\nChapter 4 - Resolutions\n\nResolutions\n\nResolutions are the product of each committee's conference; they must be written collaboratively by delegates during the conference. Any resolutions prepared before the conference will not be permitted and may result in disqualification.\n\nResolutions must have 2 main submitters, 2 co-submitters, and at least 15% of the committee as signatories.\n\nResolutions in progress must be referred to as \u201cworking papers\u201d and may not be mentioned in speeches until the resolution has been introduced.\n\nThe resolutions will be vetted during the lunch break or the second break, depending on the committee's pace. Once the Secretariat approves resolutions, they are considered \u201cdraft resolutions\u201d and are to be debated in the session after lunch.\n\nA resolution template will be provided at the beginning of committee sessions. \n\u2013 (10:30 am on Saturday)\n\nAmendments\n\nThrough an amendment document (sent by the chairs at the opening of the debate on resolutions), clauses may be added, removed, or modified to enhance the resolution's quality or applicability.\n\nAmendments must be marked either friendly or unfriendly upon review by the main submitters of the resolution.\n\nAmendments marked as friendly will be implemented upon confirmation by the chairs\n\nAmendments marked unfriendly will require a debate in which the submitter and the main submitter/s receive 30-60 seconds (at the chairs\u2019 discretion) to justify or dismiss the proposed amendment.\n\nUnfriendly amendments will then be voted on by the committee to determine whether to implement them. The amendment must reach a simple majority to pass (50% + 1)\n\nChapter 5 - Voting Procedures\n\nStructure of Voting\n\nMethods of Voting:\n\nBy Show of Placards: The standard method.\n\nBy Roll Call Vote: A delegate may motion for this. The Chair calls each country in turn. Delegates may vote: Yes, No, Yes with Rights, No with Rights, or Abstain. (Rights allow a delegate to explain a vote that contradicts their previous stance.)\n\nA Resolution passes if it receives a Simple Majority.\n\nIf it passes, it becomes (one of) the official \"Resolution of SEAMUN I 2027\" for that committee. If multiple resolutions are on the floor, they are voted on in the order they were introduced.\n\nAfter a motion to close debate has been raised, the committee immediately proceeds to the voting procedure.\n\nDuring the voting procedure, entry to the committee room is no longer permitted, and breaks are not permitted.\n\nIf there are multiple draft resolutions, the committee motions and votes for which resolution they wish to debate first.\n\nFor every draft resolution, the voting procedure includes three steps in the following order:\n\nVoting on amendments,\n\nVoting on motions for a division of the question,\n\nVoting on the draft resolution as a whole.\n\nMotions & Points\n\nPoints & Motions\n\nPoints\n\nPoint of Information (PoI): This enables delegates to ask elaborating questions to enhance understanding regarding a new solution or an otherwise vague sentence.\n\nPoint of Clarification (PoC): This enables delegates to ask clarifying questions to enhance understanding of a specific concept, statistic, or term.\n\nPoint of Parliamentary Inquiry: This enables delegates to ask questions to clarify previous, current, or future procedures regarding the committee, such as speaker time, number of submitters, the meaning of a motion or point, etc.\n\nPoint of Order: This enables delegates to correct chairs if they make a mistake in parliamentary procedure.\n\nPoint of Personal Privilege: This enables delegates to request an environmental change if it affects the entire room, such as the temperature (air conditioning).\n\nRight of Reply: This enables delegates to give a brief reply if attacked during another's speech. This may be entertained if granted by the chair; however, it is subject to rejection.\n\nFact Check: This enables delegates to question a statistic or statement regarding quantitative data of another delegate.\n\nMotions\n\nMotion to Set Agenda: This enables the committee to direct its focus to one of the topics set for debate. This is not required in the case that only one topic is up for debate.\n\nMotion to Extend Opening Speech Time: This enables delegates to extend their speeches either for more content or clarity in order to provide a stronger stance for other delegates to connect with.\n\nMotion to Open Debate: This is required when starting debate on resolutions and essentially invites the main submitters to deliver their speeches or for the chairs to make the decision of including reading time.\n\nMotion to Divide the Question: This is a rare motion used if the topic is too broad, in which case the question is minimised in its scope, and the resolutions will then be based on that sub-question.\n\nMotion to Exclude the Public: This can be done at any point, but is specifically useful during voting procedures to ensure no bias or influence within the committee walls.\n\nMotion for a Minute of Silent Prayer or Meditation: This motion can be used if delegates need a short break of silence or if a tragedy has recently occurred.\n\nMotion for a Roll Call Vote: This can be done to force all delegates to vote on motions. It ensures all delegates are able to express their vote independently.\n\nMotion to Adjourn Session: This can be done to formally end the session and conference within the committee. This must only happen on the last day at the end of the last committee session.\n\nMotion to Suspend Session: This can be done to formally pause the session for breaktime or lunch. This can happen at any time except at the end of the last committee session on the last day.\n\nMotion to Close Debate: This can be done prior to adjourning the session to acknowledge the completion of the debate at hand.\n\nMotion for an Unmoderated Caucus: This motion states that the committee has the right to move and speak (relatively) freely and negotiate without direct moderation. This can be done at any point when the floor is open to motions, given that it is after the opening speeches.\n\nMotion for a Moderated Caucus: This motion states that the committee must discuss a specified sub-topic through formal speeches for a set period of time. This can be done at any point when the floor is open to motions, given that it is after the opening speeches.\n\nMotion for a Consultation: This motion states that the committee must discuss a specified sub-topic where it is semi-moderated through a single speaker with free yielding (delegates may yield to each other directly).\n\nMotion to Vote Clause by Clause: This motion states that the committee may vote on a resolution clause-by-clause, meaning those which do not pass are immediately removed from the resolution document and are not submitted unless vetoed by the chairs.\n\nExamples\n\nExamples\n\nRoll Call Example\n\nChair 1: Delegate of Australia\n\nAustralia: Present\n\nChair 1: Delegate of Belgium\n\nBelgium: Present and Voting\n\nChair 1: Delegate of Colombia\n\nColombia: Present\n\nChair 1: Delegate of Denmark\n\nDenmark: Present\n\nChair 1: Delegate of India\n\nIndia: Present and Voting\n\nChair 1: Delegate of Switzerland\n\nSwitzerland: Present and Voting\n\nChair 1: Delegate of Turkey\n\nTurkey: Present\n\nChair 1: Delegate of the United States of America / USA\n\nUSA: Present and Voting\n\nChair 1: Delegate of Venezuela\n\nVenezuela: Present\n\nMotion Example & Formats\n\nAgenda Setting: Motion to Set Agenda to Topic 1/The Question of\u2026\n\nExtend Speaker Time: Motion to Extend Speaker Time to [X] seconds\n\nModerated Caucus:\n\nMotion for a Moderated Caucus for [X] minutes,\n\non the topic of [SUB-TOPIC],\n\nwith [X] seconds per speaker/with a speaker time of [X] seconds\n\nUnmoderated Caucus\n\nMotion for an Unmoderated Caucus for [X] minutes\n\nConsultation of a Whole\n\nMotion for a consultation of a whole for [X] minutes\n\non the topic of [SUB-TOPIC]\n\n* Note: Moderated Caucuses and Consultations require the aforementioned information, but are not required in any specific order.\n\nOpen Debate: Motion to open debate on resolution [Day #. Bloc #]\n\nClose Debate: Motion to close debate\n\nPoints Example & Formats\n\nPoint of Information (PoI): The delegate of ___ would like to ask a PoI through the chairs to the delegate of ___, how will ___ directly benefit the vulnerable populations in question?\n\nPoint of Clarification (PoC): The delegate of ___ would like to ask a PoC through the chairs to the delegate of ___, what does \u201chumanitarian aid\u201d mean?\n\nPoint of Parliamentary Inquiry: The delegate would like to inquire into what a GSL is.\n\nPoint of Order: The delegate believes speeches should alternate between for and against to simulate a real debate.\n\nPoint of Personal Privilege: The delegate is very warm. Could the air conditioning be turned cooler, please?\n\nRight of Reply: The delegate believes they have the right to reply.\n\nFact Check: The delegate would like to fact-check the statement \u201c200,000 puppies are depressed\u201d\n\n*Note: All following examples revolve around the following info:\n\nCommittee: World Health Organisation (WHO)\n\nTopic: The Question of Regulating Artificial Intelligence in Personalised Healthcare and Genomic Privacy\n\nCountry: Estonia\n\nPosition Paper Example\n\nHere is an example position paper curated by the SEAMUN team. It is scored at 40/40 using the SEAMUN Award Criteria.\n\nOpening Speech Example\n\nThe following is an example of an opening speech curated by the SEAMUN team.\n\nGSL Speech Example\n\nThe following is an example of a GSL speech curated by the SEAMUN team.\n\nResolution Example\n\nHere is an example resolution curated by the SEAMUN team.\n\nMain Submitter Speech Example\n\nThe following is an example of a main submitter speech curated by the SEAMUN team.\n\nFor Speech Example\n\nThe following is an example of a for speech curated by the SEAMUN team.\n\nAgainst Speech Example\n\nThe following is an example of an against speech curated by the SEAMUN team.\n\nAmendment Example\n\nThe following is an example of an amendment curated by the SEAMUN team.\n\nFlows\n\nSession Flow\n\nRoll Call\n\nAlphabetical order\n\nPresent = may abstain\n\nPresent & Voting = may not abstain\n\nMotion to open GSL\n\nRecognize as many speakers as possible\n\nMotion to set agenda\n\nTopic I\n\nTopic II\n\nMotion for Unmod\n\nTime\n\nMotion for Mod\n\nTime (length/2 = max. num of speakers)\n\nTopic\n\nSpeaker time\n\nMotion for Consultation\n\nTime\n\nTopic\n\nMotion to open debate on resolution\n\n1.1\n\n1.2\n\n2.1\n\n2.2\n\nMotion to close debate on topic\n\nMotion to adjourn session";

        (function () {
